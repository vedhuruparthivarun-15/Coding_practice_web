<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Program 11</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#080808;
    color:white;
}

header{
    padding:20px 7%;
    background:#111;
}

header a{
    color:#ff5a00;
    text-decoration:none;
}

.container{
    width:90%;
    max-width:1100px;
    margin:40px auto;
}

h1 span{
    color:#ff5a00;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.box{
    background:#111;
    padding:20px;
    border-radius:15px;
}

textarea{
    width:100%;
    height:450px;
    box-sizing:border-box;
    background:#050505;
    color:#00ff9d;
    padding:15px;
    font-family:monospace;
}

button{
    margin-top:15px;
    padding:12px 25px;
    background:#ff5a00;
    color:white;
    border:0;
    border-radius:8px;
}

iframe{
    width:100%;
    height:450px;
    border:0;
    background:white;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<header>
<a href="index.html">← Back to HTML Programs</a>
</header>

<div class="container">

<h1>HTML Program <span>11</span></h1>

<p>
Create a webpage demonstrating internal and external CSS styling.
</p>

<div class="grid">

<div class="box">

<h2>Code Editor</h2>

<textarea id="code"><!DOCTYPE html>
<html>

<head>

<title>Internal and External CSS</title>

<!-- External CSS -->
<link rel="stylesheet"
href="data:text/css,
.external{
background:lightblue;
padding:20px;
border:2px solid blue;
}">

<!-- Internal CSS -->

<style>

h1 {
    color: darkorange;
}

.internal {
    color: purple;
    border: 2px solid purple;
    padding: 20px;
}

</style>

</head>

<body>

<h1>Internal and External CSS</h1>

<h2>External CSS</h2>

<p class="external">
This paragraph is styled using external CSS.
</p>

<p class="internal">
This paragraph is styled using internal CSS.
</p>

</body>

</html></textarea>

<button onclick="runCode()">▶ Run Code</button>

</div>

<div class="box">

<h2>Output</h2>

<iframe id="output"></iframe>

</div>

</div>

</div>

<script>
function runCode(){
    document.getElementById("output").srcdoc =
        document.getElementById("code").value;
}

runCode();
</script>

</body>
</html>
