<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Program 08</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#080808;
    color:white;
}

header{
    padding:20px 7%;
    background:#111;
}

header a{
    color:#ff5a00;
    text-decoration:none;
}

.container{
    width:90%;
    max-width:1100px;
    margin:40px auto;
}

h1 span{
    color:#ff5a00;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.box{
    background:#111;
    padding:20px;
    border-radius:15px;
}

textarea{
    width:100%;
    height:450px;
    box-sizing:border-box;
    background:#050505;
    color:#00ff9d;
    padding:15px;
    font-family:monospace;
}

button{
    margin-top:15px;
    padding:12px 25px;
    background:#ff5a00;
    color:white;
    border:0;
    border-radius:8px;
}

iframe{
    width:100%;
    height:450px;
    border:0;
    background:white;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
<a href="index.html">← Back to HTML Programs</a>
</header>

<div class="container">

<h1>HTML Program <span>08</span></h1>

<p>
Demonstrate semantic elements such as header,
nav, section, article and footer.
</p>

<div class="grid">

<div class="box">

<h2>Code Editor</h2>

<textarea id="code"><!DOCTYPE html>
<html>

<head>
    <title>Semantic HTML</title>
</head>

<body>

<header>
    <h1>My College Website</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
</nav>

<section>

    <h2>Latest News</h2>

    <article>

        <h3>Web Development Workshop</h3>

        <p>
            A workshop on HTML, CSS and JavaScript
            is being conducted this week.
        </p>

    </article>

</section>

<footer>
    <p>© 2026 College Website</p>
</footer>

</body>
</html></textarea>

<button onclick="runCode()">▶ Run Code</button>

</div>

<div class="box">

<h2>Output</h2>

<iframe id="output"></iframe>

</div>

</div>

</div>

<script>
function runCode(){
    document.getElementById("output").srcdoc =
        document.getElementById("code").value;
}

runCode();
</script>

</body>
</html>
