<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML 01 - Basic Webpage</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #080808;
            color: white;
        }

        header {
            padding: 25px 8%;
            background: #111;
            border-bottom: 1px solid #333;
        }

        header a {
            color: #ff5a00;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .title {
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 40px;
        }

        .title span {
            color: #ff5a00;
        }

        .box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .editor,
        .output-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 350px;
            background: #050505;
            color: #00ff9d;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            resize: none;
            font-family: monospace;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #ff5a00;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #ff7a30;
            transform: translateY(-2px);
        }

        iframe {
            width: 100%;
            height: 350px;
            background: white;
            border: none;
            border-radius: 10px;
        }

        @media(max-width: 800px) {
            .box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">← Back to HTML Programs</a>
</header>

<div class="container">

    <div class="title">
        <h1>HTML <span>Program 01</span></h1>

        <p>
            Create a basic HTML webpage using headings,
            paragraphs and line breaks.
        </p>
    </div>

    <div class="box">

        <div class="editor">

            <h2>Code Editor</h2>

            <textarea id="code">
<!DOCTYPE html>
<html>
<head>
    <title>My First Webpage</title>
</head>

<body>

    <h1>Welcome to My Webpage</h1>

    <h2>About HTML</h2>

    <p>
        HTML stands for HyperText Markup Language.
        It is used to create webpages.
    </p>

    <p>
        HTML is easy to learn.<br>
        HTML uses different tags.<br>
        These tags create webpage elements.
    </p>

</body>
</html>
            </textarea>

            <button onclick="runCode()">▶ Run Code</button>

        </div>


        <div class="output-box">

            <h2>Output</h2>

            <iframe id="output"></iframe>

        </div>

    </div>

</div>


<script>
    function runCode() {

        let code = document.getElementById("code").value;

        document.getElementById("output").srcdoc = code;
    }

    runCode();
</script>

</body>
</html>
