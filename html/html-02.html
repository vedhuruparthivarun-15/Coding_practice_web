<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Program 02</title>

    <style>
        body {
            font-family: Arial;
            background: #080808;
            color: white;
            margin: 0;
        }

        header {
            padding: 20px 7%;
            background: #111;
        }

        a {
            color: #ff5a00;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 span {
            color: #ff5a00;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .box {
            background: #111;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        textarea {
            width: 100%;
            height: 400px;
            box-sizing: border-box;
            background: #050505;
            color: #00ff9d;
            padding: 15px;
            font-family: monospace;
            border-radius: 10px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #ff5a00;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
            background: white;
            border-radius: 10px;
        }

        @media(max-width:800px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">← Back to HTML Programs</a>
</header>

<div class="container">

<h1>HTML Program <span>02</span></h1>

<p>
Create an HTML page containing ordered, unordered,
and description lists.
</p>

<div class="grid">

<div class="box">

<h2>Code Editor</h2>

<textarea id="code"><!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>

<body>

<h1>HTML Lists</h1>

<h2>Ordered List</h2>

<ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>

<h2>Unordered List</h2>

<ul>
    <li>Python</li>
    <li>C</li>
    <li>Java</li>
</ul>

<h2>Description List</h2>

<dl>
    <dt>HTML</dt>
    <dd>Used to create webpage structure.</dd>

    <dt>CSS</dt>
    <dd>Used to style webpages.</dd>

    <dt>JavaScript</dt>
    <dd>Used to add interaction.</dd>
</dl>

</body>
</html></textarea>

<button onclick="runCode()">▶ Run Code</button>

</div>

<div class="box">

<h2>Output</h2>

<iframe id="output"></iframe>

</div>

</div>

</div>

<script>
function runCode() {
    document.getElementById("output").srcdoc =
        document.getElementById("code").value;
}

runCode();
</script>

</body>
</html>
