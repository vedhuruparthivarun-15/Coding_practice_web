<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Program 10</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#080808;
    color:white;
}

header{
    padding:20px 7%;
    background:#111;
}

header a{
    color:#ff5a00;
    text-decoration:none;
}

.container{
    width:90%;
    max-width:1100px;
    margin:40px auto;
}

h1 span{
    color:#ff5a00;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.box{
    background:#111;
    padding:20px;
    border-radius:15px;
}

textarea{
    width:100%;
    height:450px;
    box-sizing:border-box;
    background:#050505;
    color:#00ff9d;
    padding:15px;
    font-family:monospace;
}

button{
    margin-top:15px;
    padding:12px 25px;
    background:#ff5a00;
    color:white;
    border:0;
    border-radius:8px;
}

iframe{
    width:100%;
    height:450px;
    border:0;
    background:white;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
<a href="index.html">← Back to HTML Programs</a>
</header>

<div class="container">

<h1>HTML Program <span>10</span></h1>

<p>Create a college timetable using an HTML table.</p>

<div class="grid">

<div class="box">

<h2>Code Editor</h2>

<textarea id="code"><!DOCTYPE html>
<html>

<head>

<title>College Timetable</title>

<style>

table {
    border-collapse: collapse;
    width: 100%;
    text-align: center;
}

th, td {
    border: 1px solid black;
    padding: 12px;
}

th {
    background-color: lightblue;
}

</style>

</head>

<body>

<h1>College Timetable</h1>

<table>

<tr>
<th>Day</th>
<th>9-10</th>
<th>10-11</th>
<th>11-12</th>
<th>12-1</th>
</tr>

<tr>
<th>Monday</th>
<td>Math</td>
<td>Python</td>
<td>DBMS</td>
<td rowspan="5">Lunch</td>
</tr>

<tr>
<th>Tuesday</th>
<td>DSA</td>
<td>Math</td>
<td>HTML</td>
</tr>

<tr>
<th>Wednesday</th>
<td>Python</td>
<td>OS</td>
<td>DSA</td>
</tr>

<tr>
<th>Thursday</th>
<td>DBMS</td>
<td>HTML</td>
<td>Math</td>
</tr>

<tr>
<th>Friday</th>
<td>OS</td>
<td>DSA</td>
<td>Python</td>
</tr>

</table>

</body>
</html></textarea>

<button onclick="runCode()">▶ Run Code</button>

</div>

<div class="box">

<h2>Output</h2>

<iframe id="output"></iframe>

</div>

</div>

</div>

<script>
function runCode(){
    document.getElementById("output").srcdoc =
        document.getElementById("code").value;
}

runCode();
</script>

</body>
</html>
