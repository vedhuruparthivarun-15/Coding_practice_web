<!DOCTYPE html>
<html>
<head>
    <title>CSS 14 - Visibility Opacity</title>

    <style>
        body {
            background: #081018;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        .box {
            padding: 30px;
            margin: 15px;
            background: #123b50;
            border: 2px solid cyan;
        }

        .visible {
            visibility: visible;
        }

        .hidden {
            visibility: hidden;
        }

        .opacity-100 {
            opacity: 1;
        }

        .opacity-50 {
            opacity: 0.5;
        }

        .opacity-20 {
            opacity: 0.2;
        }
    </style>
</head>

<body>

    <h1>Visibility and Opacity</h1>

    <div class="box visible">
        Visibility: Visible
    </div>

    <div class="box hidden">
        Visibility: Hidden
    </div>

    <div class="box opacity-100">
        Opacity: 1
    </div>

    <div class="box opacity-50">
        Opacity: 0.5
    </div>

    <div class="box opacity-20">
        Opacity: 0.2
    </div>

</body>
</html>
