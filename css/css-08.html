<!DOCTYPE html>
<html>
<head>
    <title>CSS 08 - Fonts</title>

    <style>
        body {
            background: #081018;
            color: white;
            padding: 30px;
        }

        h1 {
            font-family: Georgia;
            font-size: 40px;
        }

        .normal {
            font-weight: normal;
        }

        .bold {
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }

        .smallcaps {
            font-variant: small-caps;
        }

        .custom {
            font-family: "Courier New";
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>CSS Font Properties</h1>

    <p class="normal">Normal Font</p>

    <p class="bold">Bold Font</p>

    <p class="italic">Italic Font</p>

    <p class="smallcaps">Small Caps Font</p>

    <p class="custom">
        Courier New Font
    </p>

</body>
</html>
