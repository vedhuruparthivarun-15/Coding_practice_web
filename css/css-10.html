<!DOCTYPE html>
<html>
<head>
    <title>CSS 10 - Box Model</title>

    <style>
        body {
            background: #081018;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        .box {
            width: 250px;
            margin: 40px auto;
            padding: 30px;
            border: 8px solid #00d9ff;
            background: #17384a;
        }

        .content {
            background: #24566d;
            padding: 30px;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">

        <div class="content">
            Content
        </div>

        Padding<br>
        Border<br>
        Margin

    </div>

</body>
</html>
