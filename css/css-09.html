<!DOCTYPE html>
<html>
<head>
    <title>CSS 09 - Text Properties</title>

    <style>
        body {
            background: #081018;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
        }

        .text {
            text-align: justify;
            text-indent: 40px;
            letter-spacing: 2px;
            word-spacing: 8px;
            line-height: 2;
            text-decoration: none;
        }

        .line {
            text-decoration: line-through;
        }

        .upper {
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <h1>Text Properties</h1>

    <p class="text">
        CSS provides many text properties.
        These properties control alignment,
        decoration, transformation,
        indentation and spacing.
    </p>

    <p class="line">
        Line Through Text
    </p>

    <p class="upper">
        This text becomes uppercase.
    </p>

</body>
</html>
