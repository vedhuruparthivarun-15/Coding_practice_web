<!DOCTYPE html>
<html>
<head>
    <title>CSS 11 - Width Height</title>

    <style>
        body {
            background: #081018;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        .box {
            width: 60%;
            height: 150px;
            min-width: 250px;
            max-width: 700px;
            min-height: 100px;
            max-height: 250px;

            margin: 30px auto;
            padding: 30px;

            background: #123b50;
            border: 2px solid cyan;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Width and Height</h1>

    <div class="box">
        <h2>Responsive Box</h2>
        <p>
            Width: 60%<br>
            Height: 150px<br>
            Min / Max Width and Height
        </p>
    </div>

</body>
</html>
