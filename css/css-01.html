<!DOCTYPE html>
<html>
<head>
    <title>CSS 01 - Inline Internal External CSS</title>

    <style>
        body {
            font-family: Arial;
            background: #101820;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .internal {
            color: #00d9ff;
            background: #182b38;
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <h1>CSS Types</h1>

    <h2 style="color: #ff4d6d;">
        Inline CSS
    </h2>

    <p class="internal">
        Internal CSS
    </p>

    <div class="external">
        External CSS
    </div>

    <p>
        Inline CSS is written inside the style attribute.
        Internal CSS is written inside the style tag.
        External CSS is written in a separate CSS file.
    </p>

</body>
</html>
