<!DOCTYPE html>
<html>
<head>
    <title>CSS 04 - Colors</title>

    <style>
        body {
            background-color: #081018;
            font-family: Arial;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .text {
            color: cyan;
            font-size: 24px;
        }

        .background {
            background-color: #16384d;
            padding: 20px;
            margin: 15px;
        }

        .border {
            border: 3px solid #00d9ff;
            padding: 20px;
            margin: 15px;
        }

        button {
            background-color: #00d9ff;
            color: #001018;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1 class="text">CSS Colors</h1>

    <div class="background">
        Background Color
    </div>

    <div class="border">
        Border Color
    </div>

    <button>Colorful Button</button>

</body>
</html>
