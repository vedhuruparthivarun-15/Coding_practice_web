<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 19 - Objects</title>

    <style>
        body {
            background: #090611;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            color: #c77dff;
        }

        .box {
            background: #160d24;
            padding: 25px;
            border-radius: 15px;
        }

        button {
            padding: 12px 20px;
            background: #9d4edd;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #output {
            margin-top: 20px;
            color: #e0aaff;
            line-height: 2;
        }
    </style>
</head>

<body>

<h1>JavaScript Objects</h1>

<div class="box">

    <button onclick="showObject()">
        Display Object
    </button>

    <div id="output"></div>

</div>

<script>

const student = {

    name: "Varun",
    age: 20,
    course: "CSE AI/ML",
    city: "Chennai"

};

function showObject() {

    document.getElementById("output").innerHTML =
        "Name = " + student.name + "<br>" +
        "Age = " + student.age + "<br>" +
        "Course = " + student.course + "<br>" +
        "City = " + student.city;

}

</script>

</body>
</html>
