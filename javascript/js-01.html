<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 01 - Hello World</title>

    <style>
        body {
            background: #090611;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            color: #c77dff;
        }

        .box {
            background: #160d24;
            border: 1px solid #9d4edd;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
        }

        button {
            background: #9d4edd;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 24px;
            color: #e0aaff;
        }
    </style>
</head>

<body>

<h1>JavaScript Program 01</h1>

<div class="box">

    <h2>Hello World</h2>

    <button onclick="showMessage()">
        Run Program
    </button>

    <div id="output"></div>

</div>

<script>

function showMessage() {
    document.getElementById("output").innerHTML =
        "Hello World";
}

</script>

</body>
</html>
