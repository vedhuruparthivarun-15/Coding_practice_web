<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 15 - Functions</title>

    <style>
        body {
            background: #090611;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            color: #c77dff;
        }

        .box {
            background: #160d24;
            padding: 25px;
            border-radius: 15px;
        }

        button {
            padding: 12px 20px;
            background: #9d4edd;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            color: #e0aaff;
            line-height: 2;
        }
    </style>
</head>

<body>

<h1>JavaScript Functions</h1>

<div class="box">

    <button onclick="showResult()">
        Run Function
    </button>

    <div id="output"></div>

</div>

<script>

function add(a, b) {
    return a + b;
}

function multiply(a, b) {
    return a * b;
}

function showResult() {

    let sum = add(10, 20);
    let product = multiply(10, 20);

    document.getElementById("output").innerHTML =
        "Addition = " + sum + "<br>" +
        "Multiplication = " + product;

}

</script>

</body>
</html>
