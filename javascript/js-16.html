<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 16 - Arrow Functions</title>

    <style>
        body {
            background: #090611;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            color: #c77dff;
        }

        .box {
            background: #160d24;
            padding: 25px;
            border-radius: 15px;
        }

        button {
            padding: 12px 20px;
            background: #9d4edd;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #output {
            margin-top: 20px;
            color: #e0aaff;
            line-height: 2;
        }
    </style>
</head>

<body>

<h1>Arrow Functions</h1>

<div class="box">

    <button onclick="runProgram()">
        Run Program
    </button>

    <div id="output"></div>

</div>

<script>

const add = (a, b) => a + b;

const square = n => n * n;

const greet = name => "Hello " + name;

function runProgram() {

    document.getElementById("output").innerHTML =
        "Addition = " + add(10, 20) + "<br>" +
        "Square = " + square(5) + "<br>" +
        greet("Student");

}

</script>

</body>
</html>
