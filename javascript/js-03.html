<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 02 - Arithmetic</title>

    <style>
        body {
            background: #090611;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            color: #c77dff;
        }

        .box {
            background: #160d24;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #9d4edd;
        }

        input {
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid #9d4edd;
        }

        button {
            padding: 12px 20px;
            background: #9d4edd;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            line-height: 2;
            color: #e0aaff;
        }
    </style>
</head>

<body>

<h1>JavaScript Program 02</h1>

<div class="box">

    <input type="number" id="a" placeholder="First number">
    <input type="number" id="b" placeholder="Second number">

    <br><br>

    <button onclick="calculate()">Calculate</button>

    <div id="output"></div>

</div>

<script>

function calculate() {

    let a = Number(document.getElementById("a").value);
    let b = Number(document.getElementById("b").value);

    document.getElementById("output").innerHTML =
        "Addition = " + (a + b) + "<br>" +
        "Subtraction = " + (a - b) + "<br>" +
        "Multiplication = " + (a * b) + "<br>" +
        "Division = " + (a / b) + "<br>" +
        "Modulus = " + (a % b);

}

</script>

</body>
</html>
