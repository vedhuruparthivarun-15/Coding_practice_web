<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 09 - Palindrome</title>

    <style>
        body {
            background: #090611;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            color: #c77dff;
        }

        .box {
            background: #160d24;
            padding: 25px;
            border-radius: 15px;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            background: #9d4edd;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #output {
            margin-top: 20px;
            color: #e0aaff;
        }
    </style>
</head>

<body>

<h1>Palindrome Number</h1>

<div class="box">

    <input type="number" id="num" placeholder="Enter number">

    <button onclick="checkPalindrome()">Check</button>

    <div id="output"></div>

</div>

<script>

function checkPalindrome() {

    let num = document.getElementById("num").value;

    let reverse = num.split("").reverse().join("");

    if (num === reverse) {
        document.getElementById("output").innerHTML =
            num + " is a Palindrome";
    } else {
        document.getElementById("output").innerHTML =
            num + " is not a Palindrome";
    }

}

</script>

</body>
</html>
