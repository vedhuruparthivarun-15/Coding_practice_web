<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 08 - Prime Number</title>

    <style>
        body {
            background: #090611;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            color: #c77dff;
        }

        .box {
            background: #160d24;
            padding: 25px;
            border-radius: 15px;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            background: #9d4edd;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #output {
            margin-top: 20px;
            color: #e0aaff;
        }
    </style>
</head>

<body>

<h1>Prime Number Check</h1>

<div class="box">

    <input type="number" id="num" placeholder="Enter number">

    <button onclick="checkPrime()">Check</button>

    <div id="output"></div>

</div>

<script>

function checkPrime() {

    let n = Number(document.getElementById("num").value);
    let prime = true;

    if (n < 2) {
        prime = false;
    }

    for (let i = 2; i <= Math.sqrt(n); i++) {

        if (n % i === 0) {
            prime = false;
            break;
        }

    }

    document.getElementById("output").innerHTML =
        prime ? n + " is a Prime Number"
              : n + " is not a Prime Number";

}

</script>

</body>
</html>
